# Where every file under assets/ comes from. Each pack is kept, as downloaded, in the
# asset library (asset-library/INDEX.md) under the same slug.
#
# source: a pack slug from `packs`, "own" (made for this game), or "unknown"
#         (origin not yet confirmed; then `todo` says what to do).
# original: the file's path inside that pack. modified: what was changed.
# todo: what still has to be done about a file.
# generated_with: for `own` files made with an AI tool; CREDITS.md says so instead of "made by hand".

packs:
  font-jacquard-12:
    name: "Jacquard 12"
    author: "Sarah Cadigan-Fried (Soft Type Project)"
    url: https://fonts.google.com/specimen/Jacquard+12
    license: OFL-1.1
    used_for: "title font"
  font-silkscreen:
    name: "Silkscreen"
    author: "Jason Kottke"
    url: https://fonts.google.com/specimen/Silkscreen
    license: OFL-1.1
    used_for: "UI font"
  hydrogene-8-bit-truth:
    name: "8-bit - Truth"
    author: "HydroGene"
    url: https://opengameart.org/content/8-bit-truth
    license: CC0-1.0
    changes: "converted from MP3 to Ogg Vorbis (quality 5); the sound is unchanged"
    used_for: "menu music"
  hydrogene-8-bit-epic-space-shooter-music:
    name: "8-bit Epic Space Shooter Music"
    author: "HydroGene"
    url: https://opengameart.org/content/8-bit-epic-space-shooter-music
    license: CC0-1.0
    changes: "converted from MP3 to Ogg Vorbis (quality 5); the sound is unchanged"
    used_for: "chase music"
  kenney-interface-sounds:
    name: "Interface Sounds"
    author: "Kenney"
    url: https://kenney.nl/assets/interface-sounds
    license: CC0-1.0
    used_for: "jump sound"

