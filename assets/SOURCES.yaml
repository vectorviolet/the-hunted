# Where every file under assets/ comes from. Each pack is kept, as downloaded, in the
# asset library (asset-library/INDEX.md) under the same slug.
#
# source: a pack slug from `packs`, "own" (made for this game), or "unknown"
#         (origin not yet confirmed; then `todo` says what to do).
# original: the file's path inside that pack. modified: what was changed.
# todo: what still has to be done about a file.

packs:
  ansimuz-mountain-at-dusk:
    name: "Mountain at Dusk Background"
    author: "Luis Zuno (ansimuz)"
    url: https://opengameart.org/content/mountain-at-dusk-background
    license: CC0-1.0
    used_for: "parallax background layers"
  amir027-platform-tile4:
    name: "Platform tile4"
    author: "amir027"
    url: https://opengameart.org/content/platform-tile4
    license: CC0-1.0
    used_for: "platform tile"
  font-comic-neue:
    name: "Comic Neue"
    author: "Craig Rozynski"
    url: https://fonts.google.com/specimen/Comic+Neue
    license: OFL-1.1
    used_for: "UI font"
  redshrike-lpc-four-characters:
    name: "Four characters: My LPC entries"
    author: "Stephen \"Redshrike\" Challener"
    url: https://opengameart.org/content/four-characters-my-lpc-entries
    license: CC-BY-3.0
    license_note: "offered as CC BY 3.0, CC BY-SA 3.0 or OGA-BY 3.0; CC BY 3.0 chosen"
    attribution: "Stephen \"Redshrike\" Challener, with a link to https://opengameart.org"
    changes: "each 64x64 walking frame is cut out of the original sheet; the pixels are unchanged"
    used_for: "the peasant (Baldric)"
  wyver9-8bit-beatem-up:
    name: "8-Bit Beat'em Up Soundtrack"
    author: "wyver9"
    url: https://wyver9.bandcamp.com/album/8-bit-beatem-up-soundtrack/
    license: CC-BY-SA-4.0
    attribution: "\"8-Bit Beat'em Up Soundtrack\" by wyver9"
    used_for: "menu and chase music"

