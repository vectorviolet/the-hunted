[project]
name = "hunted"
version = "0.2.1"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce",
    "pygamine",
    # The credits page reads assets/SOURCES.yaml at runtime (pygamine needs it too).
    "pyyaml>=6",
]

[dependency-groups]
# Tooling for producing distributable builds (see hunted.spec / CI).
build = [
    "pyinstaller>=6.0",
]
# Only for the art-candidate scripts in scripts/art_gen/ (not needed to run or build the game).
art = [
    "pillow>=10",
    "numpy>=1.26",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff==0.17.5",
    "mypy==2.4.1",
    # Same version as `uvx codespell@...` in ci.yml's spelling job.
    "codespell==2.4.3",
    # Type stubs for pyyaml (mypy checks src/credits.py).
    "types-pyyaml==6.0.12.20261113",
]

[tool.uv.sources]
pygamine = { path = "src/pygamine", editable = true }

[tool.ruff]
# ruff's own default, written out: both `ruff check` and `ruff format` use it.
line-length = 88
# The pygamine submodule has its own ruff configuration and CI.
extend-exclude = ["src/pygamine"]

[tool.ruff.format]
# Black-compatible formatting; Black's defaults throughout.
quote-style = "double"

[tool.ruff.lint]
# Deliberately narrow, like pygamine's: F (pyflakes -- real bugs such as
# unused imports or undefined names), not pycodestyle's style rules.
# PLR6301 (no-self-use): a method that doesn't use `self` should be a static
# method or a module-level function. It's a preview rule; `preview = true` with
# `explicit-preview-rules = true` turns on only the preview rules selected by
# their full code here, not every preview rule or preview behavior.
# C901, PLR0912 and PLR0915 cap a function's complexity, branches and
# statements, at ruff's defaults for now (see [tool.ruff.lint.mccabe] and
# [tool.ruff.lint.pylint]).
select = [
    "F",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
    "PLR6301",
    "C901",
    "PLR0912",
    "PLR0915",
]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# Every function and method in the source code declares its return type (the
# ANN rules above). Test functions don't: pytest calls them and no type checker
# runs here. Fixtures and helpers in tests that return a value still get one.
"tests/**" = ["ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]

[tool.codespell]
# Typos plus British -> American spelling (American English everywhere).
# Run: uv run --group dev codespell
builtin = "clear,rare,en-GB_to_en-US"
# .codespell-en-us.txt adds the British doubled-l forms the built-ins miss
# (traveled, leveled, ... spelled with -ll-); "-" keeps the built-ins.
# "-" goes last: first, it would read as a command-line flag.
dictionary = "./.codespell-en-us.txt,-"
# .github too (hidden folders are skipped by default); .git and .venv aren't ours.
check-hidden = true
# Not ours or not text: the pygamine submodule (its own repo), assets and
# binaries, the lock file, the verbatim license texts in licenses/, and local files (virtualenv, tool caches, builds).
# Also the project dictionary itself (it lists British forms).
skip = "./.codespell-en-us.txt,./.git,./.venv,.*_cache,__pycache__,./dist,./build,./htmlcov,./src/pygamine,./assets,./licenses,./uv.lock,*.png,*.gif,*.ico,*.ogg,*.mp3,*.wav,*.ttf"
# Real words codespell flags, one per line with why:
#   datas: PyInstaller's Analysis(datas=...) argument (hunted.spec, util/paths.py)
#   challener: surname of the peasant sprites' author (CREDITS.md, README.md)
ignore-words-list = "datas,challener"

[tool.mypy]
# A lenient start: the app's own code under src/, default (non-strict)
# checks, untyped functions skipped. Tighten later, e.g. with
# check_untyped_defs or per-module strict overrides.
python_version = "3.12"
files = ["src"]
# src/pygamine first, so `pygamine` is the engine package, not its repo folder.
mypy_path = ["src/pygamine", "src"]
explicit_package_bases = true
# The pygamine submodule has its own CI; its types are used, its errors not reported.
exclude = ["^src/pygamine/"]

[[tool.mypy.overrides]]
module = ["pygamine", "pygamine.*"]
follow_imports = "silent"

[tool.pytest.ini_options]
# Puts src/ + src/pygamine on sys.path so tests can `import entities` /
# `import combat` etc. without per-file path hacks (mirrors __main__.py).
pythonpath = ["src", "src/pygamine"]
testpaths = ["tests"]

[tool.coverage.run]
# pygamine is a vendored submodule with its own separate test suite
# (engine-tests in CI) -- the coverage badge should reflect only this app's
# own code. "src" alone finds the flat top-level files (game.py, entities.py,
# ...) but coverage.py's static discovery of *unexecuted* files doesn't
# reliably recurse into subdirectories, so src/util is listed separately.
# omit is needed now that tests actually construct Application/GameObject
# (Game(), Cursor()) -- without it, pygamine's own modules get pulled into
# this app's report the moment they're imported, contrary to the comment
# above (previously masked only because no test happened to exercise them).
source = ["src", "src/util"]
omit = ["src/pygamine/*"]
